# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: agent + redis (+ nginx nếu làm phần cộng điểm)
#
# Service `redis` đã cho sẵn — chạy ngay từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# NHIỆM VỤ: bổ sung service `agent`. Yêu cầu:
#   [ ] build từ Dockerfile trong thư mục hiện tại
#   [ ] map cổng ra ngoài (8000:8000)
#   [ ] KHÔNG viết secret thẳng vào file này — dùng nội suy biến môi trường
#       `${AGENT_API_KEY}` (docker compose tự đọc từ file .env cùng thư mục)
#   [ ] REDIS_URL trỏ tới `redis://redis:6379/0` — trong compose, tên service
#       chính là hostname
#   [ ] depends_on: redis
#   [ ] healthcheck gọi /health
#
# MỞ RỘNG TÙY CHỌN: thêm service `nginx` làm load balancer
# (không phải bonus chấm điểm riêng; nginx/nginx.conf đã có sẵn)
#     docker compose up --scale agent=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Đọc từ file .env — KHÔNG viết secret thẳng vào file này
      AGENT_API_KEY: ${AGENT_API_KEY}
      # Trong compose, tên service chính là hostname: redis://redis:6379
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?Set AGENT_API_KEY in .env}
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_OUTPUT_LIMIT_PARAMETER: ${LLM_OUTPUT_LIMIT_PARAMETER:-max_tokens}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-32000}
      REAL_AGENT_GLOBAL_BUDGET_USD: ${REAL_AGENT_GLOBAL_BUDGET_USD:-10}
      REAL_AGENT_ENABLED: ${REAL_AGENT_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-}
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_SECONDARY_BASE_URL: ${LLM_SECONDARY_BASE_URL:-}
      LLM_SECONDARY_API_KEY: ${LLM_SECONDARY_API_KEY:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-}
      LLM_MAX_INPUT_USD_PER_MILLION: ${LLM_MAX_INPUT_USD_PER_MILLION:-}
      LLM_MAX_OUTPUT_USD_PER_MILLION: ${LLM_MAX_OUTPUT_USD_PER_MILLION:-}
    stop_grace_period: 150s
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
